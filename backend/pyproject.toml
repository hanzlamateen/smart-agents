[tool.poetry]
package-mode = false
name = "smart-agents-backend"
description = "A FastAPI service for smart agents"
authors = ["Hanzla Mateen <hanzlamateen@live.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = {extras = ["standard"], version = "0.117.1"}
uvicorn = "^0.27.0"
pydantic = "2.11.9"
pydantic-settings = "2.11.0"
boto3 = ">=1.28.57"
anthropic = {extras = ["bedrock", "vertex"], version = ">=0.39.0"}
httpx = "^0.27.0"
sse-starlette = "^2.0.0"
sqlalchemy = "^2.0.0"
pymysql = "^1.1.0"
cryptography = "^42.0.0"
python-dotenv = "^1.0.0"
docker = "^7.1.0"
asyncssh = "^2.22.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
